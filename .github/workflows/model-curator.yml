name: Model Pareto report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-pareto-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s model-curator -p 'test_*.py'
      - name: Generate report
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python model-curator/curate.py
      - name: Open or update report PR
        id: report-pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/model-pareto-report
          add-paths: |
            model-curator/MODELS.md
            model-curator/plots/*.svg
            opencode-config/models.json
          commit-message: "Update model Pareto report"
          title: "Update OpenCode model Pareto report"
          body: |
            Latest AA Intelligence Index and task costs intersected with the OpenCode Go and paid catalogs.

            Review `model-curator/MODELS.md` for both frontiers, coverage and special pricing.
            Also updates the model config fragment: only frontier models stay enabled,
            with aliases for curated picks. After merge, the config workflow publishes
            the merged config for machines enrolled in hourly sync.
      - name: Run summary
        env:
          PR_URL: ${{ steps.report-pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Report PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report changes; no PR needed." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat model-curator/MODELS.md >> "$GITHUB_STEP_SUMMARY"
