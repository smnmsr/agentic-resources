name: Model Pareto report

on:
  workflow_dispatch:
  schedule:
    - cron: "42 0 * * *"

permissions:
  contents: write

concurrency:
  group: model-pareto-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r opencode-config/requirements.txt
      - name: Test curator
        run: python -m unittest discover -s model-curator -p 'test_*.py'
      - name: Test config
        run: python -m unittest discover -s opencode-config -p 'test_*.py'
      - name: Generate report
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python model-curator/curate.py
      # GITHUB_TOKEN pushes do not trigger the separate config publisher.
      - name: Validate and merge config
        run: python opencode-config/config.py
      - name: Publish changed outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-curator/MODELS.md model-curator/plots/*.svg opencode-config/models.json opencode-config/opencode.json
          if git diff --cached --quiet; then
            echo "No report, frontier or config changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Update curated models and published config'
          git push origin HEAD:main
          echo "Published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run summary
        run: |
          echo "Safety checks, both test suites and merged-config validation passed." >> "$GITHUB_STEP_SUMMARY"
          cat model-curator/MODELS.md >> "$GITHUB_STEP_SUMMARY"
