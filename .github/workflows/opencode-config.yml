name: Publish OpenCode config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - opencode-config/models.json
      - opencode-config/settings.json
      - opencode-config/config.py
      - opencode-config/requirements.txt
      - .github/workflows/opencode-config.yml
  pull_request:
    paths:
      - opencode-config/**
      - model-curator/**
      - .github/workflows/opencode-config.yml

permissions:
  contents: read

concurrency:
  group: opencode-config-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r opencode-config/requirements.txt
      - run: python -m unittest discover -s model-curator -p 'test_*.py'
      - run: python -m unittest discover -s opencode-config -p 'test_*.py'
      - name: Validate and merge
        run: python opencode-config/config.py
      - name: Publish on main (retry from fresh sources if main advances)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            checkout="$RUNNER_TEMP/config-publish-$attempt"
            git worktree add --detach "$checkout" origin/main
            python "$checkout/opencode-config/config.py"
            git -C "$checkout" add opencode-config/opencode.json
            if git -C "$checkout" diff --cached --quiet; then exit 0; fi
            git -C "$checkout" commit -m 'Generate merged OpenCode config'
            if git -C "$checkout" push origin HEAD:main; then exit 0; fi
          done
          exit 1
